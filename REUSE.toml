# SPDX-License-Identifier: Apache-2.0
#
# REUSE (https://reuse.software) metadata for files that cannot carry
# a license header themselves (test certificates, data files, docs) and
# repository-wide copyright information. Files with their own SPDX
# header keep it; this annotation is added on top ("aggregate").
version = 1

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2008-2026 Rainer Gerhards, Adiscon GmbH and the librelp contributors"
SPDX-License-Identifier = "Apache-2.0"
